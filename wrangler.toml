name = "judol-adblock"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# ── Environment Variables ──
# Set di Cloudflare Dashboard → Workers → Settings → Variables
# OMNIROUTE_API_URL = "http://129.226.89.157:20128/v1"

# ── Optional: KV Namespace untuk caching stats ──
# Uncomment setelah buat KV Namespace di dashboard
# [[kv_namespaces]]
# binding = "MY_KV"
# id = "YOUR_KV_NAMESPACE_ID"

# ── Routes (opsional) ──
# routes = [
#   { pattern = "blocklist.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]
